<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#4a5684">

<title>Bone Type · Skeleton & Muscles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;color:#fff;font-family:'Inter Tight',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{position:fixed;inset:0;touch-action:manipulation;-webkit-user-select:none;user-select:none}
  body[data-theme="dusk"]{background:radial-gradient(120% 90% at 50% 36%,#8794c4 0%,#6676a8 36%,#485482 70%,#343e66 100%),#3a4470}
  body[data-theme="night"]{background:radial-gradient(110% 85% at 50% 40%,#3c4b74 0%,#2a3557 40%,#1a2139 75%,#111625 100%)}
  #gl{position:fixed;left:0;top:0;display:block;cursor:grab;touch-action:none}
  #gl:active{cursor:grabbing}
  #ui,#menu,#overlay{position:fixed;left:0;right:0;top:var(--vt,0px);height:var(--vh,100%)}
  #ui{display:flex;flex-direction:column;pointer-events:none}
  .topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;padding:calc(16px + env(safe-area-inset-top)) 22px 0;gap:10px}
  .pills{display:flex;gap:8px;flex-wrap:wrap}
  .pills.right{justify-content:flex-end}
  .pill{font:500 11px 'JetBrains Mono',monospace;letter-spacing:.03em;color:rgba(255,255,255,.78);border:1px solid rgba(255,255,255,.24);border-radius:999px;padding:5px 12px;background:rgba(255,255,255,.04);backdrop-filter:blur(6px);white-space:nowrap}
  button.pill{pointer-events:auto;cursor:pointer;outline:none}
  button.pill:hover{background:rgba(255,255,255,.12)}
  .center{display:flex;flex-direction:column;align-items:center;gap:10px}
  .stats{display:flex;gap:20px;align-items:baseline;padding-top:4px}
  .stats b{font-weight:700;font-size:17px;letter-spacing:-.01em}
  .stats i{font:500 9px 'JetBrains Mono',monospace;font-style:normal;opacity:.6;margin-left:3px}
  #hintTag{opacity:0;transition:opacity .4s}
  #hintTag.show{opacity:1}
  #stage{flex:1;min-height:100px}
  #wordArea{text-align:center;padding-bottom:20px}
  #wordArea,#kb,.center{transition:opacity .4s}
  body.menu #wordArea,body.menu #kb,body.menu .center{opacity:0}
  #label{font:500 10.5px 'JetBrains Mono',monospace;letter-spacing:.22em;opacity:.62;margin-bottom:8px}
  #word{font-weight:700;font-size:72px;letter-spacing:-.035em;line-height:1.08;height:1.14em;white-space:pre}
  #word .t{color:#fff;text-shadow:0 0 26px rgba(255,255,255,.28)}
  #word .g{color:rgba(255,255,255,.3)}
  #word .x{color:#ff8a98;text-shadow:0 0 18px rgba(255,90,110,.6)}
  #word .u{color:transparent;text-decoration:underline;text-decoration-color:rgba(255,255,255,.28);text-decoration-thickness:3px;text-underline-offset:8px;margin:0 .03em}
  #word.done .t{text-shadow:0 0 40px #fff,0 0 12px #fff}
  #word.done{transform:scale(1.04);transition:transform .2s}
  .caret{display:inline-block;width:3px;height:.86em;background:#fff;vertical-align:-.06em;margin:0 2px;border-radius:2px;animation:blink 1s steps(1) infinite;box-shadow:0 0 10px rgba(255,255,255,.6)}
  @keyframes blink{50%{opacity:0}}
  .shake{animation:shake .2s}
  @keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
  #sub{font:400 11.5px 'JetBrains Mono',monospace;opacity:.65;margin-top:8px;height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 12px}
  #kb{width:min(660px,92vw);margin:0 auto 30px;display:flex;flex-direction:column;gap:6px}
  .row{display:flex;gap:6px}
  .key{height:34px;border-radius:6px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;font:400 10.5px 'JetBrains Mono',monospace;color:rgba(255,255,255,.55);transition:background .35s,color .35s,box-shadow .35s,transform .1s}
  body[data-theme="night"] .key{background:rgba(255,255,255,.055)}
  .key.on{background:#f5f7ff;color:#29304d;box-shadow:0 0 20px rgba(255,255,255,.6);transition:none;transform:translateY(1px)}
  .key.bad{background:#ff6b7d;color:#fff;box-shadow:0 0 20px rgba(255,90,110,.6);transition:none}
  .corner{position:fixed;bottom:14px;font:400 9.5px 'JetBrains Mono',monospace;letter-spacing:.14em;opacity:.45;pointer-events:none}
  #cornerR{right:22px} #cornerL{left:22px}

  /* mobile typing */
  #ti{position:fixed;top:0;left:0;width:2px;height:2px;opacity:0;border:0;padding:0;margin:0;font-size:16px;background:transparent;color:transparent;caret-color:transparent;pointer-events:none;outline:none}
  #mobBar{display:none;justify-content:center;gap:8px;margin-top:12px;pointer-events:auto}
  .mb{all:unset;cursor:pointer;font:500 12px 'JetBrains Mono',monospace;padding:8px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);color:rgba(255,255,255,.88)}
  .mb:disabled{opacity:.3}
  body.touch #kb{display:none}
  body.touch #mobBar{display:flex}
  body.touch #wordArea{pointer-events:auto;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
  body.touch .corner{display:none}
  body.menu #mobBar{display:none}
  body.kbopen #kbBtn{display:none}

  /* overlay cards */
  #overlay{display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .35s;padding:16px}
  #overlay.show{opacity:1}
  .card{text-align:center;padding:30px 46px;border-radius:20px;background:rgba(14,19,38,.42);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);max-width:100%}
  .card .k{font:500 11px 'JetBrains Mono',monospace;letter-spacing:.3em;opacity:.6}
  .card .t{font-weight:800;font-size:54px;letter-spacing:-.035em;margin:6px 0 4px}
  .card .s{font:400 12px 'JetBrains Mono',monospace;opacity:.7;line-height:1.6}
  .card .r2{display:flex;gap:26px;justify-content:center;flex-wrap:wrap;margin:10px 0 14px;font:400 11px 'JetBrains Mono',monospace;opacity:.8}
  .card .r2 b{font:700 18px 'Inter Tight',sans-serif;display:block}
  .cbtns{display:flex;gap:8px;justify-content:center;margin-top:16px}
  .cbtn{all:unset;pointer-events:auto;cursor:pointer;font:600 14px 'Inter Tight',sans-serif;padding:10px 22px;border-radius:11px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22)}
  .cbtn.pri{background:#fff;color:#232a46;border-color:#fff}
  .cbtn span{font:500 10px 'JetBrains Mono',monospace;opacity:.5;margin-left:6px}
  body.touch .cbtn span{display:none}

  /* menu */
  #menu{display:flex;align-items:center;padding-left:5vw;pointer-events:none;opacity:0;transition:opacity .35s}
  body.menu #menu{opacity:1}
  .mcard{pointer-events:auto;width:min(470px,92vw);max-height:calc(var(--vh,100vh) - 40px);overflow-y:auto;padding:24px 24px 22px;border-radius:22px;background:rgba(14,19,38,.42);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 30px 80px rgba(0,0,0,.25);scrollbar-width:none}
  .mcard::-webkit-scrollbar{display:none}
  body:not(.menu) .mcard{pointer-events:none}
  .brand{font-weight:800;font-size:42px;letter-spacing:-.04em;line-height:1}
  .brand span{color:rgba(255,255,255,.35)}
  .msub{font:400 11px 'JetBrains Mono',monospace;opacity:.6;margin:7px 0 4px}
  .sec{font:500 10px 'JetBrains Mono',monospace;letter-spacing:.22em;opacity:.6;margin:16px 0 8px;display:flex;justify-content:space-between}
  .modes,.subj{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .subj{grid-template-columns:1fr 1fr}
  .mode{all:unset;display:block;cursor:pointer;padding:11px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);position:relative;transition:background .2s,border-color .2s,color .2s}
  .mode:hover{background:rgba(255,255,255,.1)}
  .mode.sel{background:rgba(255,255,255,.93);color:#252c48;border-color:#fff}
  .mode.learn{grid-column:1/-1}
  .mode em{display:block;font:500 9px 'JetBrains Mono',monospace;letter-spacing:.18em;opacity:.55;font-style:normal;margin-bottom:3px}
  .mode b{display:block;font-size:15px;font-weight:700;letter-spacing:-.01em}
  .mode small{display:block;font:400 10px 'JetBrains Mono',monospace;opacity:.65;margin-top:3px;line-height:1.35}
  .mode kbd{position:absolute;top:9px;right:10px;font:500 9.5px 'JetBrains Mono',monospace;opacity:.5;border:1px solid currentColor;border-radius:4px;padding:0 4px}
  body.touch .mode kbd{display:none}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{all:unset;display:inline-block;cursor:pointer;font:500 11px 'JetBrains Mono',monospace;padding:6px 11px;border-radius:999px;border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.78);transition:all .2s}
  .chip:hover{background:rgba(255,255,255,.1)}
  .chip.sel{background:#f2f4ff;color:#252c48;border-color:#f2f4ff}
  .chip i{font-style:normal;opacity:.5;margin-left:6px}
  #startBtn{all:unset;display:block;cursor:pointer;margin-top:20px;width:100%;box-sizing:border-box;text-align:center;padding:13px;border-radius:12px;background:#fff;color:#232a46;font-weight:700;font-size:15px;box-shadow:0 0 30px rgba(255,255,255,.25);transition:transform .15s,opacity .2s}
  #startBtn:hover{transform:translateY(-1px)}
  #startBtn:disabled{opacity:.35;cursor:default;transform:none}
  #startBtn span{font:500 10.5px 'JetBrains Mono',monospace;opacity:.55;margin-left:8px}
  body.touch #startBtn span{display:none}

  @media (max-width:820px){
    #menu{padding:0 10px calc(10px + env(safe-area-inset-bottom));justify-content:center;align-items:flex-end}
    .mcard{padding:16px 16px 0;max-height:calc(var(--vh,100vh)*0.58)}
    .brand{font-size:30px}
    .msub{display:none}
    .mode small{display:none}
    .mode{padding:9px 10px}
    .sec{margin:12px 0 6px}
    #startBtn{position:sticky;bottom:0;margin:14px 0 14px;box-shadow:0 -8px 24px rgba(14,19,38,.5)}
  }
  @media (max-width:640px){
    .topbar{grid-template-columns:1fr auto;padding:calc(10px + env(safe-area-inset-top)) 12px 0;gap:8px}
    .pills.left{grid-column:1;grid-row:1}
    .pills.right{grid-column:2;grid-row:1}
    .center{grid-column:1/-1;grid-row:2;gap:6px}
    #pillMode,#roundPill,#themeBtn{display:none}
    .stats{gap:16px;padding-top:0}
    #label{font-size:9.5px;letter-spacing:.14em}
    #sub{font-size:10.5px}
    .card{padding:22px 20px}
    .card .t{font-size:40px}
  }
</style>

<script type="module">
import * as THREE from 'three';

const TAU = Math.PI * 2;
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const UP = V(0, 1, 0);
const $ = id => document.getElementById(id);
const TOUCH = matchMedia('(hover: none) and (pointer: coarse)').matches;
if (TOUCH) document.body.classList.add('touch');
const clamp01 = x => Math.min(1, Math.max(0, x));
const sstep = (a, b, x) => { const t = clamp01((x - a)/(b - a)); return t*t*(3 - 2*t); };
// rounded bump 0→1→0 on [0,1]; pk moves the peak, p<1 makes it fuller
const bell = (x, p = 0.5, pk = 0.5) => {
  x = clamp01(x); const s = x < pk ? 0.5*x/pk : 0.5 + 0.5*(x - pk)/(1 - pk);
  return Math.pow(Math.max(0, Math.sin(Math.PI*s)), p);
};

/* ================= SETTINGS (saved) ================= */
const REGIONS = {
  bone: [
    { id:'skull', label:'Skull' }, { id:'spine', label:'Spine' }, { id:'thorax', label:'Thorax' },
    { id:'arm', label:'Shoulder & arm' }, { id:'hand', label:'Hand & wrist' },
    { id:'leg', label:'Pelvis & leg' }, { id:'foot', label:'Foot & ankle' }
  ],
  muscle: [
    { id:'mNeck', label:'Neck & back' }, { id:'mTrunk', label:'Chest & abdomen' },
    { id:'mArm', label:'Shoulder & arm' }, { id:'mHip', label:'Hip & thigh' }, { id:'mLeg', label:'Lower leg' }
  ]
};
const RLABEL = Object.fromEntries([...REGIONS.bone, ...REGIONS.muscle].map(r => [r.id, r.label]));
let saved = {};
try { saved = JSON.parse(localStorage.getItem('bonetype') || '{}'); } catch (e) {}
const SET = Object.assign({ mode:'learn', subject:'bone', reg:{}, deck:12, sound:'thock', theme:'dusk' }, saved);
if (Array.isArray(saved.regions) && !saved.reg) SET.reg = { bone: saved.regions };
delete SET.regions;
for (const k of ['bone', 'muscle']){
  const ids = REGIONS[k].map(r => r.id);
  SET.reg[k] = (Array.isArray(SET.reg[k]) ? SET.reg[k] : ids).filter(id => ids.includes(id));
}
if (!REGIONS[SET.subject]) SET.subject = 'bone';
if (!['learn','1','2','3'].includes(SET.mode)) SET.mode = 'learn';
const save = () => { try { localStorage.setItem('bonetype', JSON.stringify(SET)); } catch (e) {} };

/* ================= SOUND (Web Audio, synthesized) ================= */
const SFX = (() => {
  let ac = null, master, wet, noise;
  const PENTA = [0,2,4,7,9,12,14,16,19,21];
  function unlock(){
    if (!ac){
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      ac = new AC();
      const comp = ac.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 5; comp.connect(ac.destination);
      master = ac.createGain(); master.gain.value = 0.8; master.connect(comp);
      const dl = ac.createDelay(1); dl.delayTime.value = 0.16;
      const fb = ac.createGain(); fb.gain.value = 0.35;
      const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 3200;
      wet = ac.createGain(); wet.gain.value = 0.5;
      wet.connect(dl); dl.connect(lp); lp.connect(fb); fb.connect(dl); lp.connect(master);
      noise = ac.createBuffer(1, Math.floor(ac.sampleRate * 0.4), ac.sampleRate);
      const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random()*2 - 1;
    }
    if (ac.state === 'suspended') ac.resume();
  }
  const on = () => ac && SET.sound !== 'off';
  function env(p, t, peak, a, d){ p.setValueAtTime(0.0001, t); p.exponentialRampToValueAtTime(peak, t+a); p.exponentialRampToValueAtTime(0.0001, t+a+d); }
  function tone(type, f0, f1, t, peak, a, d, dest = master, glide = 0.03){
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + glide);
    env(g.gain, t, peak, a, d); o.connect(g); g.connect(dest);
    o.start(t); o.stop(t + a + d + 0.05);
  }
  function hiss(type, freq, q, t, peak, d, dest = master){
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noise; f.type = type; f.frequency.value = freq; f.Q.value = q;
    env(g.gain, t, peak, 0.001, d); s.connect(f); f.connect(g); g.connect(dest);
    s.start(t, Math.random()*0.3); s.stop(t + d + 0.05);
  }
  function notes(base, steps, gap, peak, dec){
    const t = ac.currentTime;
    steps.forEach((st, k) => {
      const f = base * Math.pow(2, st/12), tt = t + k*gap;
      tone('sine', f, f, tt, peak, 0.004, dec);
      tone('sine', f, f, tt, peak*0.45, 0.004, dec*0.8, wet);
      tone('triangle', f*2, f*2, tt, peak*0.08, 0.002, dec*0.4);
    });
  }
  return {
    unlock,
    key(i, space){
      if (!on()) return; const t = ac.currentTime;
      if (SET.sound === 'thock'){
        const j = 1 + (Math.random() - 0.5)*0.1;
        hiss('bandpass', (space ? 1700 : 3300)*j, 1.1, t, space ? 0.2 : 0.26, 0.028);
        tone('sine', (space ? 240 : 360)*j, (space ? 105 : 170)*j, t, space ? 0.6 : 0.45, 0.002, space ? 0.12 : 0.07, master, 0.028);
        tone('square', 95*j, 70*j, t, 0.035, 0.001, 0.03, master, 0.02);
      } else {
        const f = 520 * Math.pow(2, PENTA[i % PENTA.length]/12);
        tone('sine', f*0.55, f, t, 0.32, 0.003, 0.12, master, 0.022);
        tone('sine', f*2, f*2, t, 0.05, 0.002, 0.08, wet);
        hiss('highpass', 6000, 0.7, t, 0.04, 0.01);
      }
    },
    error(){ if (!on()) return; const t = ac.currentTime;
      tone('triangle', 165, 92, t, 0.3, 0.003, 0.16, master, 0.13); hiss('lowpass', 420, 0.8, t, 0.25, 0.09); },
    word(perfect, streak){ if (!on()) return;
      const lift = perfect ? PENTA[Math.max(0, Math.min(streak - 1, 5))] : 0;
      notes(659.25 * Math.pow(2, lift/12), perfect ? [0,4,7,12] : [0,7], 0.05, 0.16, 0.5); },
    round(){ if (!on()) return; notes(392, [0,4,7,11,14], 0.075, 0.12, 0.6); },
    finish(){ if (!on()) return; notes(523.25, [0,4,7,12,16,19,24], 0.07, 0.13, 0.9); },
    reveal(){ if (!on()) return; const t = ac.currentTime;
      hiss('bandpass', 1100, 0.5, t, 0.12, 0.28); tone('sine', 330, 660, t, 0.08, 0.03, 0.3, wet, 0.3); },
    ui(){ if (!on()) return; const t = ac.currentTime;
      tone('sine', 1320, 990, t, 0.1, 0.002, 0.06, master, 0.04); hiss('highpass', 5000, 0.7, t, 0.04, 0.01); }
  };
})();

/* ================= MATERIALS ================= */
const VS = `
varying vec3 vN; varying vec3 vV; varying vec2 vUv;
void main(){
  vUv = uv;
  vec4 mv = modelViewMatrix * vec4(position,1.0);
  vN = normalize(normalMatrix * normal);
  vV = -mv.xyz;
  gl_Position = projectionMatrix * mv;
}`;
const LIGHT = `
  vec3 N = normalize(vN); vec3 E = normalize(vV);
  float ndv = dot(N,E); if(ndv < 0.0){ N = -N; ndv = -ndv; }
  vec3 L = normalize(vec3(-0.35,0.75,0.55));
  float diff = dot(N,L)*0.5 + 0.5;`;
const FIBRE = `
  float fw = fwidth(vUv.x);
  float fib = 0.5 + 0.5*cos(vUv.x*6.28318);
  fib = mix(0.5, fib, 1.0 - smoothstep(0.18, 0.55, fw));
  float td = smoothstep(0.15, 0.9, vUv.y);`;
const FS_X = `
uniform vec3 uColor; uniform float uOpacity; uniform float uRim;
varying vec3 vN; varying vec3 vV; varying vec2 vUv;
void main(){ ${LIGHT}
  float fres = pow(1.0 - ndv, 2.2);
  vec3 col = uColor*(0.62 + 0.38*diff) + uRim*fres;

function draw(cam, x, y, w, h){
  renderer.setViewport(x, y, w, h); renderer.setScissor(x, y, w, h);

function renderViews(){
  const W = VW, H = VH, wide = W >= 820;
  renderer.setScissorTest(false); renderer.clear(); renderer.setScissorTest(true);

    if (wide) draw(camMain, W*0.36, 0, W*0.64, H); else draw(camMain, 0, H*0.56, W, H*0.44);
    return;
  }
  const cTop = canvas.getBoundingClientRect().top, r = $('stage').getBoundingClientRect();
  const top = Math.max(0, r.top - cTop - 24), bot = r.bottom - cTop, hgt = Math.max(60, bot - top), y = H - bot;
  draw(camMain, wide ? W*0.22 : 0, y, wide ? W*0.56 : W, hgt);
  if (wide){
    const sh = hgt*0.92, sy = y + (hgt - sh)/2;
    draw(camL, W*0.01, sy, W*0.21, sh);

}

/* ================= INPUT: pointer ================= */
const ptrs = new Map(); let drag = false, lx = 0, zoom = 1, pinch0 = 0, zoom0 = 1, moved = 0;
const pdist = () => { const [a, b] = [...ptrs.values()]; return Math.hypot(a.x - b.x, a.y - b.y) || 1; };
document.addEventListener('pointerdown', () => SFX.unlock(), true);
canvas.addEventListener('pointerdown', e => {
  ptrs.set(e.pointerId, { x:e.clientX, y:e.clientY }); canvas.setPointerCapture(e.pointerId);
  if (ptrs.size === 1){ drag = true; lx = e.clientX; moved = 0; }
  else if (ptrs.size === 2){ drag = false; pinch0 = pdist(); zoom0 = zoom; moved = 99; }
});
canvas.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId); if (!p) return;
  moved += Math.abs(e.clientX - p.x) + Math.abs(e.clientY - p.y); p.x = e.clientX; p.y = e.clientY;
  if (ptrs.size === 2) zoom = Math.min(2.2, Math.max(0.45, zoom0*pinch0/pdist()));
  else if (drag){ pivot.rotation.y += (e.clientX - lx)*0.008; lx = e.clientX; }
});
const pend = e => {
  if (!ptrs.delete(e.pointerId)) return;
  if (ptrs.size === 0){ drag = false; if (e.pointerType === 'touch' && moved < 10 && S.phase === 'play') focusInput(); }
};
canvas.addEventListener('pointerup', pend); canvas.addEventListener('pointercancel', pend);
addEventListener('wheel', e => { zoom = Math.min(2.2, Math.max(0.45, zoom*Math.exp(e.deltaY*0.001))); }, { passive:true });

  const v = ti.value; let i = 0;

  const added = v.slice(i); tiPrev = v;
  for (const ch of added) typeChar(ch, null);

const keyMap = {};
const L1 = s => s.split('').map(c => [c, 'Key'+c.toUpperCase()]);
const rows = [
  [['`','Backquote'], ...'1234567890'.split('').map(c => [c,'Digit'+c]), ['-','Minus'], ['=','Equal'], ['del','Backspace',2]],
  [['tab','Tab',1.5], ...L1('qwertyuiop'), ['[','BracketLeft'], [']','BracketRight'], ['\\','Backslash',1.5]],
  [['caps','CapsLock',1.75], ...L1('asdfghjkl'), [';','Semicolon'], ["'",'Quote'], ['enter','Enter',2.25]],
  [['shift','ShiftLeft',2.25], ...L1('zxcvbnm'), [',','Comma'], ['.','Period'], ['/','Slash'], ['shift','ShiftRight',2.75]],
  [['','Space',1]]
];
rows.forEach(r => {
  const row = document.createElement('div'); row.className = 'row';
  r.forEach(([lab, code, w = 1]) => {
    const k = document.createElement('div'); k.className = 'key'; k.textContent = lab;
    k.style.flex = `${w} ${w} 0`; row.appendChild(k);
    (keyMap[code] ||= []).push(k);
  });

});
function pressKey(code, bad){
  if (!code) return;
  (keyMap[code] || []).forEach(el => {
    el.classList.remove('on','bad'); void el.offsetWidth; el.classList.add(bad ? 'bad' : 'on');
    clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('on','bad'), bad ? 260 : 150);
  });
}

  applyLook(); buildMenu();
}
$('overlay').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  SFX.ui();
  if (b.dataset.act === 'again') again(); else openMenu();
});
function again(){ cardId++; $('overlay').classList.remove('show'); startSession(); }

/* ================= SESSION FLOW ================= */
const wait = ms => new Promise(r => setTimeout(r, ms));
let steer = true;
F.a = 0;

function startSession(){
  const pool = poolOf(); if (!pool.length) return;
  focusInput();                                   // must run inside the tap for iOS to open the keyboard
  document.body.classList.remove('menu');
  S.token++;
  Object.assign(S, { phase:'play', subject:SET.subject, rounds: SET.mode === 'learn' ? [1,2,3] : [+SET.mode], ri:0, correct:0, errors:0,
                     chars:0, activeMs:0, wordStart:0, misses:0, streak:0, perfect:0, tricky:new Set(), cur:null });
  applyLook();
  S.deck = shuffle(pool).slice(0, SET.deck || pool.length);
  S.sessionStart = performance.now();
  $('pillMode').textContent = modeName();
  startRound();
}

async function startRound(){
  const tk = S.token;
  S.level = S.rounds[S.ri]; S.order = shuffle(S.deck); S.idx = 0;
  S.cur = null; S.locked = true;
  $('word').innerHTML = ''; $('label').textContent = ''; $('sub').textContent = '';
  $('roundPill').textContent = `round ${S.ri + 1}/${S.rounds.length}`;
  $('hintTag').classList.toggle('show', S.level === 3);
  setHighlight([]); focus(BODY_BOX, 4.3); F.a = 0; steer = true;
  updateStats();
  if (S.ri > 0) SFX.round();
  const L = LEVELS[S.level];
  const head = S.rounds.length > 1 ? `ROUND ${S.ri + 1} / ${S.rounds.length}` : `LEVEL ${S.level}`;
  await card(`<div class="k">${head}</div><div class="t">${L.title}</div><div class="s">${L.desc}</div>`, 1300);
  if (tk !== S.token) return;
  nextItem();
}

const _c = new THREE.Vector3();
function nextItem(){
  if (S.idx >= S.order.length){
    if (S.ri < S.rounds.length - 1){ S.ri++; startRound(); } else finish();
    return;
  }
  const B = S.order[S.idx];
  S.cur = B; S.info = B.info[Math.random()*B.info.length | 0];
  S.typed = ''; S.revealed = false; S.wordErr = 0; S.wordStart = 0; S.bad = '';
  setHighlight(S.info.groups);
  focus(S.info.box, 2.6);

  // face the structure: back-side items are shown from behind; level 3 flips the usual view
  const c = S.info.box.getCenter(_c);
  let a = c.z < -0.035 ? Math.PI : 0;
  if (S.level === 3) a += Math.PI;
  const fromBack = Math.abs(Math.cos(a) + 1) < 0.01;
  if (Math.abs(c.x) > 0.03) a += Math.sign(c.x)*0.45*(fromBack ? 1 : -1);   // turn the chosen side toward the camera
  F.a = a; steer = true;

  S.locked = false;
  renderWord(); updateStats();
}

function renderWord(){
  const B = S.cur, el = $('word');
  if (!B){ el.innerHTML = ''; return; }
  const name = B.name, n = S.typed.length, lvl = S.level, show = lvl === 1 || S.revealed;
  let h = '';
  for (let i = 0; i < name.length; i++){
    const c = name[i], ch = c === ' ' ? ' ' : esc(c);
    if (i < n){ h += `<span class="t">${ch}</span>`; continue; }
    if (i === n){
      h += '<span class="caret"></span>';
      if (S.bad){ h += `<span class="x">${S.bad === ' ' ? '␣' : esc(S.bad)}</span>`; continue; }
    }
    if (show || (lvl === 2 && i === 0)) h += `<span class="g">${ch}</span>`;
    else if (c === ' ') h += ' ';
    else h += `<span class="u">${ch}</span>`;
  }
  el.innerHTML = `<span id="wIn">${h}</span>`;

  // fit long names (sternocleidomastoid…) to the screen
  const kbOpen = document.body.classList.contains('kbopen');
  let fs = VW < 640 ? 46 : 72;
  if (kbOpen) fs = Math.min(fs, 40);
  el.style.fontSize = fs + 'px';
  const maxW = Math.min(VW - 28, 1100), w = $('wIn').getBoundingClientRect().width;
  if (w > maxW) el.style.fontSize = Math.max(16, fs*maxW/w) + 'px';

  $('label').textContent = `${LEVELS[lvl].tag} · ${RLABEL[B.region].toUpperCase()}`;
  $('sub').textContent =
    lvl === 1 ? `${B.latin} · ${B.meaning}` :
    lvl === 2 ? (S.revealed ? `${B.latin} · ${B.meaning}` : B.meaning) :
    (S.revealed ? `${B.latin} · ${B.meaning}` : '');
}

let badT = 0;
function typeChar(ch, code){
  if (S.phase !== 'play' || S.locked || !S.cur || !ch || ch.length !== 1) return;
  const name = S.cur.name, exp = name[S.typed.length];
  if (!S.wordStart) S.wordStart = performance.now();
  if (ch.toLowerCase() === exp.toLowerCase()){
    S.typed += exp; S.correct++; S.chars++; S.bad = '';
    SFX.key(S.typed.length, exp === ' '); pressKey(code, false);
    if (S.typed.length === name.length){ complete(); return; }
    renderWord();
  } else {
    S.errors++; S.wordErr++;
    SFX.error(); pressKey(code, true);
    try { navigator.vibrate?.(25); } catch (e) {}
    S.bad = ch; renderWord();
    const el = $('word'); el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
    const id = ++badT;
    setTimeout(() => { if (id === badT){ S.bad = ''; if (S.cur) renderWord(); } }, 260);
  }
  updateStats();
}

function reveal(){
  if (S.phase !== 'play' || S.locked || !S.cur || S.revealed) return;
  S.revealed = true; S.misses++; S.streak = 0; S.tricky.add(S.cur.name);
  SFX.reveal(); renderWord();
}

async function complete(){
  const tk = S.token; S.locked = true;
  S.activeMs += performance.now() - S.wordStart;
  const perfect = !S.wordErr && !S.revealed;
  if (perfect){ S.perfect++; S.streak++; } else { S.streak = 0; S.tricky.add(S.cur.name); }
  SFX.word(perfect, S.streak);
  $('word').classList.add('done'); renderWord();
  await wait(perfect ? 420 : 650);
  if (tk !== S.token) return;
  $('word').classList.remove('done');
  S.idx++; updateStats(); nextItem();
}

function updateStats(){
  const now = performance.now();
  const ms = S.activeMs + (S.wordStart && !S.locked ? now - S.wordStart : 0);
  $('wpm').textContent = ms > 1500 ? Math.round(S.chars/5/(ms/60000)) : 0;
  const tot = S.correct + S.errors;
  $('acc').textContent = tot ? Math.round(100*S.correct/tot) : 100;
  $('prog').textContent = S.idx;
  $('progTot').textContent = '/' + (S.order.length || 0);
}

function finish(){
  S.phase = 'done'; S.locked = true; S.cur = null;
  ti.blur();
  $('word').innerHTML = ''; $('label').textContent = ''; $('sub').textContent = '';
  $('hintTag').classList.remove('show');
  setHighlight([]); focus(BODY_BOX, 4.3); F.a = 0; steer = true;
  SFX.finish();
  const total = S.rounds.length*S.deck.length;
  const tot = S.correct + S.errors, acc = tot ? Math.round(100*S.correct/tot) : 100;
  const wpm = S.activeMs > 1500 ? Math.round(S.chars/5/(S.activeMs/60000)) : 0;
  const secs = Math.round((performance.now() - S.sessionStart)/1000);
  const time = `${Math.floor(secs/60)}:${String(secs % 60).padStart(2, '0')}`;
  const tricky = [...S.tricky];
  const what = S.subject === 'bone' ? 'bones' : 'muscles';
  card(`<div class="k">SESSION COMPLETE · ${modeName().toUpperCase()}</div>
    <div class="t">${acc}%</div>
    <div class="r2">
      <span><b>${wpm}</b>wpm</span>
      <span><b>${S.perfect}/${total}</b>perfect</span>
      <span><b>${S.misses}</b>reveals</span>
      <span><b>${time}</b>time</span>
    </div>
    <div class="s">${tricky.length ? `practise again: ${tricky.map(esc).join(' · ')}` : `every ${what.slice(0, -1)} clean — nice.`}</div>
    <div class="cbtns">
      <button class="cbtn pri" data-act="again">Again<span>↵</span></button>
      <button class="cbtn" data-act="menu">Menu<span>esc</span></button>
    </div>`);
}

/* ================= INPUT: keyboard ================= */
addEventListener('keydown', e => {
  SFX.unlock();
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const fromTi = e.target === ti;

  if (S.phase === 'menu'){
    if (e.key === 'Enter'){ e.preventDefault(); if (poolOf().length){ SFX.ui(); startSession(); } return; }
    const k = e.key.toLowerCase();
    if (k === 'b' || k === 'm'){ setSubject(k === 'b' ? 'bone' : 'muscle'); return; }
    const m = MODE_INFO.find(x => x.key.toLowerCase() === k);
    if (m){ SET.mode = m.id; save(); SFX.ui(); buildMenu(); }
    return;
  }
  if (e.key === 'Escape'){ e.preventDefault(); SFX.ui(); openMenu(); return; }
  if (S.phase === 'done'){ if (e.key === 'Enter'){ e.preventDefault(); SFX.ui(); again(); } return; }
  if (e.key === 'Tab'){ e.preventDefault(); reveal(); return; }
  if (e.key === 'Enter' || e.key === 'Backspace'){ e.preventDefault(); return; }   // strict mode: no deleting
  if (fromTi) return;                       // phone keyboard → handled by the 'input' listener
  if (e.key.length === 1){ e.preventDefault(); typeChar(e.key, e.code); }
});

/* ================= LOOP ================= */
const clock = new THREE.Clock();
let statT = 0;
function loop(){
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  const k = 1 - Math.exp(-dt*5);
  for (const n of ['cy', 'ox', 'oz', 'dist']) C[n] += (F[n] - C[n])*k;
  offset.position.set(-C.ox, -C.cy, -C.oz);

  if (drag || ptrs.size) steer = false;
  if (S.phase === 'menu'){ if (!drag && !ptrs.size) pivot.rotation.y += dt*0.25; }
  else if (steer){
    let d = F.a - pivot.rotation.y; d = Math.atan2(Math.sin(d), Math.cos(d));
    pivot.rotation.y += d*(1 - Math.exp(-dt*4));
  }

  const d = C.dist*zoom;
  camMain.position.set(0, d*0.06, d); camMain.lookAt(0, 0, 0);
  camL.position.set(-d*1.15, 0, 0);   camL.lookAt(0, 0, 0);
  camR.position.set( d*1.15, 0, 0);   camR.lookAt(0, 0, 0);

  matH.uniforms.uTime.value = t; matMH.uniforms.uTime.value = t;
  if (S.phase === 'play' && (statT += dt) > 0.25){ statT = 0; updateStats(); }
  renderViews();
}

/* ================= BOOT ================= */
if (TOUCH) $('hintTag').textContent = 'No hints. From behind.';
applyLook();
updateSoundBtn();
resize();
openMenu();
Object.assign(C, F);
loop();
</script>
</body>
</html>
